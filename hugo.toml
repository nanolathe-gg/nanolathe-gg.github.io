baseURL = 'https://nanolathe.gg/'
languageCode = 'en-us'
title = 'Nanolathe'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'RSS']

[params]
description = 'Nanolathe is an independent, open-source engine for Total Annihilation, written in Go. Try the browser demo or install the beta on Windows, Mac and Linux.'
engineRepo = 'https://github.com/nanolathe-gg/nanolathe'
engineBranch = 'main'
websiteRepo = 'https://github.com/nanolathe-gg/nanolathe-gg.github.io'

[params.reel]
youtube = 'bMWSCOY0dTc'
length = '0:43'
frames = ['battle', 'water', 'heat', 'build', 'strategic']

[markup.goldmark.renderer]
unsafe = false

[markup.highlight]
noClasses = false

[caches.images]
dir = ':cacheDir/images'
