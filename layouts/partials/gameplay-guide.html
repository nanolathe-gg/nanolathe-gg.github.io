<div class="gameplay-guide">
  <p class="gameplay-lead">{{ hugo.Data.gameplay.intro }}</p>
  {{ range hugo.Data.gameplay.groups }}
  <section class="gameplay-group" aria-labelledby="game-{{ .id }}">
    <h2 id="game-{{ .id }}">{{ .title }}</h2>
    {{ with .items }}<ul>{{ range . }}<li>{{ . }}</li>{{ end }}</ul>{{ end }}
    {{ range .paragraphs }}<p>{{ . }}</p>{{ end }}
    <a class="gameplay-source" href="{{ site.Params.engineRepo }}/blob/{{ hugo.Data.gameplay.revision }}/{{ .source }}">Implementation notes <span aria-hidden="true">↗</span></a>
  </section>
  {{ end }}
  <p class="gameplay-scope">{{ hugo.Data.gameplay.scope }}</p>
</div>
