<div class="water-demo" data-water-viewer data-scene-src="{{ .waterStudy.scene | relURL }}">
  <figure class="water-viewer">
    <div class="water-stage">
      <img data-water-poster src="{{ .waterStudy.poster | relURL }}" width="960" height="640" alt="A transport above the water and a submarine beneath it on Gods of War." loading="lazy">
      <canvas width="960" height="640" role="img" aria-label="Live water study showing a transport's reflection, a submerged submarine and a shoreline. Use the controls below to change the effects." hidden></canvas>
      <div class="water-live-badge" hidden><span>Live WebGL</span><span data-water-badge>All effects on</span></div>
    </div>
    <div class="water-controls" hidden>
      <fieldset class="water-switches"><legend>Water effects</legend>
        <label><input type="checkbox" data-water-effect="surface" checked><span>Surface shading<small>Ripples, shallow color & damp shore</small></span></label>
        <label><input type="checkbox" data-water-effect="motion" checked><span>Motion & refraction<small>Seabed and submerged hull</small></span></label>
        <label><input type="checkbox" data-water-effect="foam" checked><span>Shoreline foam<small>Waves along the coast</small></span></label>
        <label><input type="checkbox" data-water-effect="reflections" checked><span>Reflections<small>The transport above the surface</small></span></label>
      </fieldset>
      <div class="water-toolbar"><div role="group" aria-label="Water effect presets"><button type="button" data-water-preset="off" aria-pressed="false">All off</button><button type="button" data-water-preset="on" aria-pressed="true">All on</button></div><div><button type="button" data-water-play aria-pressed="false">Animate water</button><button type="button" data-water-reset>Reset</button></div></div>
      <label class="water-phase">Water phase <output data-water-time>1.0 s</output><input data-water-phase type="range" min="0" max="30" step="0.01" value="1.03"></label>
    </div>
    <figcaption><strong>Gods of War · transport + submarine</strong><span data-water-status role="status">Live controls require JavaScript and WebGL. The native engine recording is available below.</span><span>The water animates while in view. Pause to compare effects at a fixed instant. Original models and map art; a browser adaptation of Nanolathe’s water shaders.</span></figcaption>
  </figure>
  <details class="water-recording"><summary>Watch the native engine capture</summary>{{ partial "renderer-motion.html" .motion }}</details>
</div>
