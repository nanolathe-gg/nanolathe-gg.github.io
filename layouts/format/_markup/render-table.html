{{ if eq (len (index .THead 0)) 5 }}<p class="table-scroll-hint">Scroll table horizontally to see all fields →</p>{{ end }}
<div class="reference-table" role="region" tabindex="0" aria-label="{{ with .Attributes.caption }}{{ . }}{{ else }}Reference table{{ end }}">
<table>{{ with .Attributes.caption }}<caption>{{ . }}</caption>{{ end }}<thead>{{ range .THead }}<tr>{{ range . }}<th scope="col">{{ .Text }}</th>{{ end }}</tr>{{ end }}</thead><tbody>{{ range .TBody }}<tr>{{ range . }}<td>{{ .Text }}</td>{{ end }}</tr>{{ end }}</tbody></table>
</div>
