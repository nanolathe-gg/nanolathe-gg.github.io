name: Build and deploy website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.160.0'
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl --fail --location --output /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --output /tmp/hugo_checksums.txt "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          checksum=$(awk -v file="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" '$2 == file {print $1}' /tmp/hugo_checksums.txt)
          test -n "$checksum"
          echo "$checksum  /tmp/hugo.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          echo /tmp >> "$GITHUB_PATH"
      - name: Build production site
        run: hugo --gc --minify --panicOnWarning
      - name: Check generated pages and links
        run: python3 scripts/check-site.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
