<svg xmlns="http://www.w3.org/2000/svg" width="840" height="390" viewBox="0 0 840 390" role="img" aria-labelledby="title desc"><title id="title">Follow maps/island.ota through an original HPI archive</title><desc id="desc">Root at 20 points to an entry list at 28. Its maps entry points to a directory at 46, whose island.ota entry points to the file record at 72. The record points to 150 where the 68-byte file begins.</desc><rect width="840" height="390" fill="#121918"/><g font-family="monospace" font-size="15" fill="#d7e5cc"><text x="28" y="35" fill="#addb76">DIRECTORY POINTERS · absolute byte offsets</text><g stroke="#607548" fill="#24311f"><rect x="28" y="62" width="220" height="76"/><rect x="306" y="62" width="240" height="76"/><rect x="602" y="62" width="210" height="76"/><rect x="306" y="204" width="240" height="76"/><rect x="602" y="204" width="210" height="76"/></g><g fill="#d7e5cc"><text x="43" y="89">Root @ 0x14</text><text x="43" y="116">2 entries → 0x1C</text><text x="321" y="89">maps · directory</text><text x="321" y="116">name 0x51 → node 0x2E</text><text x="617" y="89">Directory @ 0x2E</text><text x="617" y="116">1 entry → 0x36</text><text x="321" y="231">island.ota · file</text><text x="321" y="258">record → 0x48</text><text x="617" y="231">File data @ 0x96</text><text x="617" y="258">68 bytes · stored</text></g><g stroke="#addb76" stroke-width="2" fill="none"><path d="M248 100h58m240 0h56m108 38v38H426v28m120 38h56"/></g><text x="28" y="329">20 plain header bytes | directory ends at 0x6C</text><text x="28" y="358" fill="#adc0b7">The other root entry, readme.txt, points to 42 bytes at 0x6C.</text></g></svg>