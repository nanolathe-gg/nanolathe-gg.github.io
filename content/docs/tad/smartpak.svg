<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410"><title>Smartpak removes repeated tick words and compresses an idle update</title><rect width="840" height="410" fill="#121918"/><g font-family="monospace" fill="#d7e5cc"><text x="28" y="36" font-size="16" fill="#addb76">STORED SMARTPAK · 20 BYTES</text><g stroke="#65784f"><rect x="28" y="57" width="214" height="83" fill="#3c4326"/><rect x="256" y="57" width="385" height="83" fill="#273b32"/><rect x="655" y="57" width="155" height="83" fill="#473b28"/></g><g font-size="17"><text x="43" y="88">FE 58 02 00 00</text><text x="43" y="116" font-size="13">set counter = 600</text><text x="271" y="88">FD 12 00 + body</text><text x="271" y="116" font-size="13">14 stored bytes; original length 18</text><text x="670" y="88">FF</text><text x="670" y="116" font-size="13">1 byte idle</text></g><path d="M448 149v44m285-44v44" stroke="#addb76" stroke-width="2"/><text x="28" y="221" font-size="16" fill="#addb76">RECONSTRUCTED UNIT SYNC · 29 BYTES</text><g stroke="#65784f"><rect x="28" y="243" width="460" height="94" fill="#273b32"/><rect x="505" y="243" width="305" height="94" fill="#473b28"/></g><text x="43" y="273" font-size="16">2C · length 18 · tick 600</text><text x="43" y="305" font-size="13">ground entry + empty scheduled slot</text><text x="520" y="273" font-size="16">2C · length 11 · tick 601</text><text x="520" y="305" font-size="13">idle body FF FF 01 00</text><text x="28" y="378" font-size="13">Original teaching context: C=283, W=9. No private recording bytes.</text></g></svg>